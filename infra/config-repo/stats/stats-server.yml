server:
  port: 0

spring:
  application:
    name: ewm-stats-server
  datasource:
    url: jdbc:postgresql://localhost:6541/ewm-stats
    username: ewm
    password: ewm
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always