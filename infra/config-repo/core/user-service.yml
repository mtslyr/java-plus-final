server:
  port: 0

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:6542/ewm-user
    username: ewm
    password: ewm
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc.time_zone: UTC
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-user.sql
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC

  shutdown: graceful

logging:
  level:
    root: info
    ru.practicum.ewm: debug
    org.zalando.logbook: trace