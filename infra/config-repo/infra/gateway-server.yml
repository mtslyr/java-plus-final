server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      # Routes are matched in order: specific paths go before general ones,
      # e.g. /users/*/events/*/requests (request-service) before /users/*/events/** (event-service).
      routes:
        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=/users/*/requests,/users/*/requests/**,/users/*/events/*/requests
        - id: comment-service
          uri: lb://comment-service
          predicates:
            - Path=/admin/comments/**,/users/*/comments,/users/*/comments/**,/users/*/events/*/comments,/events/*/comments,/events/*/comments/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/admin/users,/admin/users/**,/users/*/subscriptions,/users/*/subscriptions/**
        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/admin/events,/admin/events/**,/admin/categories/**,/admin/compilations/**,/admin/locations,/admin/locations/**,/events,/events/**,/categories,/categories/**,/compilations,/compilations/**,/locations,/locations/**,/users/*/events,/users/*/events/**
