syntax = "proto3";

package stats.service.collector;

import "google/protobuf/empty.proto";

import "recommendations/messages/user_action.proto";

option java_multiple_files = true;
option java_package = "ru.practicum.stats.service.collector";

service UserActionController {
  rpc CollectUserAction(recommendations.message.user.UserActionProto)
      returns (google.protobuf.Empty);
}