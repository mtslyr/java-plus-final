  ewm-db:
    image: postgres:16.1
    container_name: ewm-db
    ports:
      - "6542:5432"
    environment:
      - POSTGRES_PASSWORD=ewm
      - POSTGRES_USER=ewm
    volumes:
      - ewm_db_data:/var/lib/postgresql/data
      - ./infra/db/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -q -U $$POSTGRES_USER" ]
      timeout: 5s
      interval: 5s
      retries: 10

volumes:
  stats_db_data:
  ewm_db_data:
